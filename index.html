<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DJ Analyzer</title>
<style>
  :root { --bg:#fff; --fg:#111; --card:#f4f4f6; --accent:#7c3aed; --muted:#666; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f0f14; --fg:#eee; --card:#1a1a22; --muted:#999; } }
  body { font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg); max-width:760px; margin:40px auto; padding:0 16px; }
  nav { display:flex; gap:8px; margin-bottom:20px; }
  nav button { flex:1; padding:10px; border:0; border-radius:8px; background:var(--card); color:var(--fg); cursor:pointer; font-size:15px; }
  nav button.on { background:var(--accent); color:#fff; }
  .hidden { display:none; }
  #drop { border:2px dashed var(--accent); border-radius:12px; padding:40px; text-align:center; cursor:pointer; background:var(--card); }
  #drop.over { background:var(--accent); color:#fff; }
  input[type=search] { width:100%; box-sizing:border-box; padding:12px; border-radius:8px; border:1px solid var(--muted); background:var(--card); color:var(--fg); font-size:16px; }
  table { width:100%; border-collapse:collapse; margin-top:20px; }
  th, td { text-align:left; padding:10px; border-bottom:1px solid var(--card); }
  tr.click { cursor:pointer; } tr.click:hover { background:var(--card); }
  .camelot { background:var(--accent); color:#fff; padding:2px 10px; border-radius:6px; font-weight:700; }
  small { color:var(--muted); }
  #detail { margin-top:20px; background:var(--card); border-radius:12px; padding:20px; }
  #detail h2 { margin:0 0 4px; } .big { font-size:40px; font-weight:700; }
  .grid { display:flex; gap:32px; margin-top:16px; flex-wrap:wrap; }
</style>
</head>
<body>
<h1>🎧 DJ Analyzer</h1>
<nav>
  <button id="tab-analyze" class="on">Analyser</button>
  <button id="tab-search">Rechercher</button>
</nav>

<section id="analyze">
  <div id="drop">Glisse tes morceaux ici ou clique pour choisir<br><small>MP3, WAV, FLAC, AIFF, M4A, OGG — 100 Mo max, audio jamais conservé</small></div>
  <input id="file" type="file" accept="audio/*" multiple hidden>
  <table>
    <thead><tr><th>Morceau</th><th>BPM</th><th>Tonalité</th><th>Camelot</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</section>

<section id="search" class="hidden">
  <input id="q" type="search" placeholder="Titre ou artiste…">
  <div id="detail" class="hidden"></div>
  <h3>Mes morceaux analysés</h3>
  <table>
    <thead><tr><th>Morceau</th><th>BPM</th><th>Camelot</th></tr></thead>
    <tbody id="results"></tbody>
  </table>
  <p id="empty" class="hidden"><small>Aucun morceau analysé ne correspond.</small></p>
  <h3>Catalogue en ligne</h3>
  <p id="online-msg"><small></small></p>
  <table>
    <tbody id="online"></tbody>
  </table>
</section>
<p><small>Données en ligne : <a href="https://getsongbpm.com" target="_blank" rel="noopener">GetSongBPM</a></small></p>

<script>
const $ = id => document.getElementById(id);
function el(tag, props = {}, ...kids) {
  const e = Object.assign(document.createElement(tag), props);
  kids.forEach(k => e.append(k));
  return e;
}
const badge = c => el("span", { className: "camelot", textContent: c });
const fmtTime = s => Math.floor(s / 60) + ":" + String(Math.round(s % 60)).padStart(2, "0");
const label = t => t.artist ? `${t.artist} — ${t.title}` : t.title;

// ---- Onglets
function show(tab) {
  ["analyze", "search"].forEach(t => {
    $(t).classList.toggle("hidden", t !== tab);
    $("tab-" + t).classList.toggle("on", t === tab);
  });
  if (tab === "search") runSearch();
}
$("tab-analyze").onclick = () => show("analyze");
$("tab-search").onclick = () => show("search");

// ---- Analyse
const drop = $("drop"), input = $("file");
drop.onclick = () => input.click();
input.onchange = () => handle(input.files);
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); handle(e.dataTransfer.files); };

async function handle(files) {
  for (const f of files) {
    const tr = el("tr", {}, el("td", { textContent: f.name }), el("td", { colSpan: 3, textContent: "Analyse en cours…" }));
    $("rows").prepend(tr);
    try {
      const fd = new FormData(); fd.append("file", f);
      const r = await fetch("/api/analyze", { method: "POST", body: fd });
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail);
      const bpm = el("td", {}, el("b", { textContent: d.bpm }));
      if (d.bpm_alternatives.length) bpm.append(el("br"), el("small", { textContent: "ou " + d.bpm_alternatives.join(" / ") }));
      tr.replaceChildren(el("td", { textContent: label(d) }), bpm, el("td", { textContent: d.key }), el("td", {}, badge(d.camelot)));
    } catch (e) { tr.lastChild.textContent = "Erreur : " + e.message; }
  }
}

// ---- Recherche
let timer;
$("q").oninput = () => { clearTimeout(timer); timer = setTimeout(runSearch, 300); };

async function runSearch() {
  const d = await (await fetch("/api/search?q=" + encodeURIComponent($("q").value))).json();
  $("empty").classList.toggle("hidden", d.local.length > 0);
  $("results").replaceChildren(...d.local.map(t => {
    const tr = el("tr", { className: "click" },
      el("td", { textContent: label(t) }), el("td", { textContent: t.bpm }), el("td", {}, badge(t.camelot)));
    tr.onclick = () => showDetail(t);
    return tr;
  }));

  const msg = $("online-msg").firstChild;
  if (!d.online_enabled) msg.textContent = "Clé GetSongBPM non configurée (voir le fichier .env).";
  else if (d.online_error) msg.textContent = d.online_error;
  else if (!$("q").value.trim()) msg.textContent = "Tape un titre ou un artiste pour chercher en ligne.";
  else msg.textContent = d.online.length ? "Clique sur un morceau pour voir ses infos." : "Aucun résultat en ligne.";

  $("online").replaceChildren(...d.online.map(t => {
    const tr = el("tr", { className: "click" }, el("td", { textContent: label(t) }));
    tr.onclick = async () => {
      msg.textContent = "Chargement…";
      const r = await fetch("/api/online/" + encodeURIComponent(t.id));
      const full = await r.json();
      if (!r.ok) { msg.textContent = full.detail; return; }
      msg.textContent = "Clique sur un morceau pour voir ses infos.";
      showDetail(full);
    };
    return tr;
  }));
}

function showDetail(t) {
  const box = $("detail");
  box.classList.remove("hidden");
  const stat = (name, value) => el("div", {}, el("small", { textContent: name }), el("div", { className: "big" }, value));
  const grid = el("div", { className: "grid" },
    stat("BPM", String(t.bpm)),
    stat("Camelot", t.camelot ? badge(t.camelot) : "?"),
    stat("Tonalité", t.key || "?"));
  if (t.duration_sec) grid.append(stat("Durée", fmtTime(t.duration_sec)));
  const sub = [t.artist || "Artiste inconnu", t.album].filter(Boolean).join(" · ");
  box.replaceChildren(el("h2", { textContent: t.title }), el("small", { textContent: sub }), grid);
  if (t.uri) box.append(el("p", {}, el("small", {}, "Source : ", el("a", { href: t.uri, target: "_blank", rel: "noopener", textContent: "GetSongBPM" }))));
  box.scrollIntoView({ behavior: "smooth" });
}
</script>
</body>
</html>
