services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GETSONGBPM_API_KEY=${GETSONGBPM_API_KEY:-}
      - WATCHFILES_FORCE_POLLING=true   # nécessaire pour détecter les changements sous Windows
    volumes:
      - ./app:/srv/app
      - ./static:/srv/static
      - dj-data:/srv/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  dj-data:
    name: dj-data   # réutilise la base déjà créée
